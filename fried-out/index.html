<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ZeusWeusFilm - Fried Out</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #080a0b;
            color: #e8e8e8;
            min-height: 100%;
        }

        body {
            font-family: Georgia, serif;
        }

        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.72),
                    rgba(0, 0, 0, 0.72)
                ),
                url("images/background.webp");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: blur(2px);

            opacity: 0.30;

            transform: scale(1.02);

            z-index: 0;

            pointer-events: none;
        }

        /* =========================
           PAGE CONTENT
        ========================= */

        .page-content {
            position: relative;

            z-index: 1;

            width: 100%;

            min-height: 100vh;

            padding:
                25px
                20px
                0;

            display: flex;

            flex-direction: column;

            text-align: center;
        }

        /* =========================
           ZEUSWEUSFILM LOGO
        ========================= */

        .logo {
            display: block;

            width: 120px;

            max-width: 45vw;

            height: auto;

            margin:
                0 auto
                35px;
        }

        /* =========================
           FILM TITLE
        ========================= */

        .film-title {
            margin:
                0 0 40px;

            font-family:
                Georgia,
                serif;

            font-size: 38px;

            font-weight: normal;

            letter-spacing: 2px;

            color: #e8e8e8;
        }

        /* =========================
           SYNOPSIS
        ========================= */

        .description {
            width: 95%;

            max-width: 950px;

            margin:
                0 auto 30px;

            font-family:
                Georgia,
                serif;

            font-size: 17px;

            line-height: 1.6;

            color: #cfcfcf;
        }

        /* =========================
           SOCIAL LINKS
        ========================= */

        .social-links {
            margin-top: auto;

            padding-top: 60px;

            padding-bottom: 35px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 22px;

            flex-wrap: wrap;
        }

        .social-links a {
            color: #bdbdbd;

            font-family:
                Georgia,
                serif;

            font-size: 15px;

            letter-spacing: 1px;

            text-decoration: none;

            transition:
                color 0.2s ease,
                opacity 0.2s ease;
        }

        .social-links a:hover {
            color: #ffffff;

            opacity: 0.8;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .page-content {
                padding-left: 15px;
                padding-right: 15px;
            }

            .film-title {
                font-size: 30px;
            }

            .description {
                font-size: 16px;
            }

            .social-links {
                gap: 16px;
            }

            .social-links a {
                font-size: 14px;
            }

        }

    </style>

</head>

<body>

    <div class="background"></div>

    <div class="page-content">

        <img
            class="logo"
            src="../zwflogo.webp"
            alt="ZeusWeusFilm">

        <h1 class="film-title">
            Fried Out
        </h1>

        <div class="description">
            It's just a fantasy, even if these sketches leave your brain all fried out.
        </div>

        <div class="social-links">

            <a
                href="https://www.patreon.com/c/zeusweusfilm"
                target="_blank"
                rel="noopener noreferrer">
                Patreon
            </a>

            <a
                href="https://www.youtube.com/@ZeusWeusFilm"
                target="_blank"
                rel="noopener noreferrer">
                YouTube
            </a>

            <a
                href="https://www.instagram.com/zeusweusfilm"
                target="_blank"
                rel="noopener noreferrer">
                Instagram
            </a>

            <a
                href="https://x.com/ZeusWeusFilm"
                target="_blank"
                rel="noopener noreferrer">
                X
            </a>

            <a
                href="https://paypal.me/ASmyth115"
                target="_blank"
                rel="noopener noreferrer">
                PayPal
            </a>

        </div>

    </div>

</body>
</html>
