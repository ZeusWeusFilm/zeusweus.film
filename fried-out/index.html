<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ZeusWeusFilm - Fried Out</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #080a0b;
            color: #e8e8e8;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.72),
                    rgba(0, 0, 0, 0.72)
                );

            filter: blur(2px);
            opacity: 0.30;
            transform: scale(1.02);

            z-index: 0;
            pointer-events: none;
        }

        .page-content {
            position: relative;
            z-index: 1;

            width: 100%;
            min-height: 100vh;

            padding: 25px 20px 35px;
            text-align: center;
        }

        .logo {
            display: block;
            width: 120px;
            max-width: 45vw;
            height: auto;

            margin: 0 auto 35px;
        }

        .film-title {
            margin: 0 0 40px;

            font-family: Georgia, serif;
            font-size: 38px;
            font-weight: normal;
            letter-spacing: 2px;
            color: #e8e8e8;
        }

        .coming-soon {
            width: 90%;
            max-width: 900px;

            margin: 0 auto;

            font-family: Georgia, serif;
            font-size: 18px;
            line-height: 1.6;

            color: #cfcfcf;
        }

        .back-link {
            display: inline-block;

            margin-top: 50px;

            color: #cfcfcf;
            text-decoration: none;

            font-family: Georgia, serif;
            font-size: 16px;
            letter-spacing: 1px;

            transition:
                color 0.25s ease,
                opacity 0.25s ease;
        }

        .back-link:hover {
            color: #ffffff;
            opacity: 0.8;
        }

        .social-links {
            margin: 60px auto 0;
            padding-bottom: 35px;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 22px;

            flex-wrap: wrap;
        }

        .social-links a {
            color: #bdbdbd;
            text-decoration: none;

            font-family: Arial, sans-serif;
            font-size: 14px;

            transition:
                color 0.2s ease,
                opacity 0.2s ease;
        }

        .social-links a:hover {
            color: #ffffff;
            opacity: 0.8;
        }

        @media (max-width: 600px) {

            .page-content {
                padding-left: 15px;
                padding-right: 15px;
            }

            .film-title {
                font-size: 30px;
            }

            .coming-soon {
                font-size: 16px;
            }

            .social-links {
                gap: 16px;
            }

        }

    </style>

</head>

<body>

    <div class="background"></div>

    <div class="page-content">

        <img
            class="logo"
            src="../zwflogo.webp"
            alt="ZeusWeusFilm">

        <h1 class="film-title">
            Fried Out
        </h1>

        <div class="coming-soon">
            This page is currently being prepared.
        </div>

        <a
            class="back-link"
            href="../index.html">
            Back to ZeusWeusFilm
        </a>

        <div class="social-links">

            <a
                href="https://www.patreon.com/c/zeusweusfilm"
                target="_blank"
                rel="noopener noreferrer">
                Patreon
            </a>

            <a
                href="https://www.youtube.com/@ZeusWeusFilm"
                target="_blank"
                rel="noopener noreferrer">
                YouTube
            </a>

            <a
                href="https://www.instagram.com/zeusweusfilm"
                target="_blank"
                rel="noopener noreferrer">
                Instagram
            </a>

            <a
                href="https://x.com/ZeusWeusFilm"
                target="_blank"
                rel="noopener noreferrer">
                X
            </a>

            <a
                href="https://paypal.me/ASmyth115"
                target="_blank"
                rel="noopener noreferrer">
                PayPal
            </a>

        </div>

    </div>

</body>
</html>
