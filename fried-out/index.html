<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZeusWeusFilm - Fried Out</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #080a0b;
            color: #e8e8e8;
        }

        body {
            font-family: Georgia, serif;
            overflow-x: hidden;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.72),
                    rgba(0, 0, 0, 0.72)
                ),
                url("images/background.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(2px);
            opacity: 0.30;
            transform: scale(1.02);
            z-index: 0;
            pointer-events: none;
        }

        .page-content {
            position: relative;
            z-index: 1;
            width: 100%;
            min-height: 100vh;
            padding: 25px 20px 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .logo-link {
            display: block;
            width: fit-content;
            margin: 0 auto 35px;
        }

        .logo {
            display: block;
            width: 120px;
            max-width: 40vw;
            height: auto;
        }

        h1 {
            margin: 0 0 35px;
            font-family: Georgia, serif;
            font-size: 36px;
            font-weight: normal;
            letter-spacing: 2px;
            color: #e8e8e8;
        }

        h2 {
            margin: 0 0 25px;
            font-family: Georgia, serif;
            font-size: 24px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        /* Video player */
        .video-section {
            width: 95%;
            max-width: 950px;
            margin: 0 auto;
        }

        .video-player-wrapper {
            width: 100%;
            margin: 0 auto 25px;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.45);
        }

        #video-player {
            display: block;
            width: 100%;
            height: auto;
            max-height: 80vh;
            background: #000;
        }

        /* Video menu */
        .video-menu {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 12px;
            flex-wrap: wrap;
            margin: 0 auto;
        }

        .video-menu-button {
            appearance: none;
            -webkit-appearance: none;
            border: 1px solid rgba(232, 232, 232, 0.45);
            background: rgba(0, 0, 0, 0.45);
            color: #e8e8e8;
            padding: 13px 20px;
            min-width: 150px;
            font-family: Georgia, serif;
            font-size: 14px;
            line-height: 1.3;
            letter-spacing: 1px;
            cursor: pointer;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                opacity 0.2s ease;
        }

        .video-menu-button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(232, 232, 232, 0.75);
        }

        .video-menu-button.active {
            background: rgba(255, 255, 255, 0.14);
            border-color: #e8e8e8;
        }

        .description {
            width: 95%;
            max-width: 950px;
            margin: 30px auto 0;
            font-family: Georgia, serif;
            font-size: 17px;
            line-height: 1.6;
            color: #cfcfcf;
        }

        /* Exact Knock Knock separator */
        .separator {
            width: 70%;
            max-width: 700px;
            height: 1px;
            margin: 35px auto;
            background: linear-gradient(
                to right,
                transparent,
                rgba(255, 255, 255, 0.45),
                transparent
            );
        }

        /* Xtra Fried */
        .xtra-fried {
            width: 95%;
            max-width: 950px;
            margin: 0 auto;
        }

        .xtra-menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            margin: 0 auto;
        }

        .xtra-menu .video-menu-button {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        /* BTS gallery */
        .gallery-section {
            width: 100%;
            margin: 0 auto;
        }

        .gallery {
            width: 95%;
            max-width: 950px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .gallery-item {
            position: relative;
            margin: 0;
            overflow: hidden;
            cursor: pointer;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            transition: transform 0.25s ease;
        }

        .gallery-item figcaption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 11px 10px;
            background: rgba(0, 0, 0, 0.68);
            color: #e8e8e8;
            font-family: Georgia, serif;
            font-size: 14px;
            line-height: 1.4;
            letter-spacing: 0.5px;
            text-align: center;
            opacity: 0;
            transform: translateY(100%);
            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
            pointer-events: none;
        }

        .gallery-item:hover figcaption {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-item:hover img {
            transform: scale(1.02);
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.92);
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox-image {
            display: block;
            max-width: 95%;
            max-height: 90vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 18px;
            right: 24px;
            border: 0;
            background: transparent;
            color: #e8e8e8;
            font-family: Arial, sans-serif;
            font-size: 38px;
            font-weight: normal;
            line-height: 1;
            cursor: pointer;
            padding: 5px 10px;
            opacity: 0.85;
            transition: opacity 0.2s ease;
        }

        .lightbox-close:hover {
            opacity: 1;
        }

        /* Master footer links */
        .social-links {
            margin-top: auto;
            padding-top: 60px;
            padding-bottom: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .social-links a {
            color: #e8e8e8;
            text-decoration: none;
            font-family: Georgia, serif;
            font-size: 15px;
            letter-spacing: 1px;
            transition: opacity 0.2s ease;
        }

        .social-links a:hover {
            opacity: 0.65;
        }

        @media (max-width: 600px) {

            .page-content {
                padding-left: 15px;
                padding-right: 15px;
            }

            .logo-link {
                margin-bottom: 30px;
            }

            .logo {
                width: 100px;
            }

            h1 {
                font-size: 30px;
                margin-bottom: 30px;
            }

            h2 {
                font-size: 20px;
            }

            .video-section,
            .xtra-fried {
                width: 100%;
            }

            .video-player-wrapper {
                margin-bottom: 20px;
            }

            .video-menu {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .video-menu-button {
                width: 100%;
                min-width: 0;
                padding: 12px 8px;
                font-size: 12px;
                letter-spacing: 0.7px;
            }

            .description {
                width: 95%;
                font-size: 16px;
                margin-top: 25px;
            }

            .separator {
                width: 80%;
                margin: 30px auto;
            }

            .xtra-menu {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .gallery-item figcaption {
                opacity: 1;
                transform: translateY(0);
                font-size: 13px;
                padding: 11px 8px;
            }

            .gallery-item:hover img {
                transform: none;
            }

            .lightbox {
                padding: 20px;
            }

            .lightbox-close {
                top: 10px;
                right: 12px;
                font-size: 34px;
            }

            .social-links {
                margin-top: auto;
                padding-top: 60px;
                padding-bottom: 35px;
                gap: 14px;
            }

            .social-links a {
                font-size: 13px;
                letter-spacing: 1px;
            }

        }
    </style>
</head>

<body>

                <button

    <div

            onclick="closeLightboxButton(event)">
            &times;
        </button>

        <img
            class="lightbox-image"
            id="lightbox-image"
            src=""
            alt="Behind the scenes">

    </div>

    <script>
        function selectVideo(
            button,
            videoUrl,
            posterUrl,
            descriptionText
        ) {
            const player = document.getElementById("video-player");
            const source = document.getElementById("video-source");
            const description = document.getElementById("video-description");
            const buttons = document.querySelectorAll(".video-menu-button");

            /*
                Remember exactly where the visitor is on the page
                before the native video player reloads.
            */
            const scrollX = window.scrollX;
            const scrollY = window.scrollY;

            player.pause();
            source.src = videoUrl;
            player.poster = posterUrl;
            description.textContent = descriptionText;
            player.load();

            buttons.forEach(function(menuButton) {
                menuButton.classList.remove("active");
            });

            button.classList.add("active");

            /*
                Some browsers reposition the page when a video source
                is reloaded. Restore the visitor's exact position after
                the browser has processed the change.
            */
            requestAnimationFrame(function() {
                window.scrollTo(scrollX, scrollY);

                requestAnimationFrame(function() {
                    window.scrollTo(scrollX, scrollY);
                });
            });
        }

        function openLightbox(imageUrl) {
            const lightbox = document.getElementById("lightbox");
            const lightboxImage = document.getElementById("lightbox-image");

            lightboxImage.src = imageUrl;
            lightbox.classList.add("open");

            document.body.style.overflow = "hidden";
        }

        function closeLightbox(event) {
            if (
                event.target.id === "lightbox" ||
                event.target.id === "lightbox-image"
            ) {
                document.getElementById("lightbox").classList.remove("open");
                document.getElementById("lightbox-image").src = "";

                document.body.style.overflow = "";
            }
        }

        function closeLightboxButton(event) {
            event.stopPropagation();

            document.getElementById("lightbox").classList.remove("open");
            document.getElementById("lightbox-image").src = "";

            document.body.style.overflow = "";
        }

        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                document.getElementById("lightbox").classList.remove("open");
                document.getElementById("lightbox-image").src = "";

                document.body.style.overflow = "";
            }
        });
    </script>

</body>
</html>
