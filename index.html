<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        background-color: #080a0b;
        color: white;
        text-align: center;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    .logo {
        width: 150px;
        max-width: 60%;
        height: auto;
        margin-top: 25px;
        margin-bottom: 20px;
    }

    .title {
        font-family: "Creepster", cursive;
        font-size: 42px;
        letter-spacing: 3px;
        margin: 10px 0 18px;
        color: #e8e8e8;
        text-shadow: 0 0 8px #666;
    }

    .video-container {
        width: 90%;
        max-width: 1100px;
        margin: 0 auto;
        aspect-ratio: 16 / 9;
    }

    .video-container iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
</style>

<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
