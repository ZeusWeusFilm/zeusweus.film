<!DOCTYPE html>
<html>
<head>
    <title>ZeusWeusFilm</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html {
            background-color: #080a0b;
        }

        body {
            background-color: #080a0b;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Faint blurred background image */
        body::before {
            content: "";
            position: fixed;
            top: -20px;
            left: -20px;
            width: calc(100% + 40px);
            height: calc(100% + 40px);
            background-image: url("background.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(5px);
            opacity: 0.20;
            z-index: 0;
            pointer-events: none;
        }

        /* Dark overlay to keep the background subtle */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 10, 11, 0.55);
            z-index: 1;
            pointer-events: none;
        }

        /* Keep website content above the background */
        body > * {
            position: relative;
            z-index: 2;
        }

        .logo {
            width: 120px;
            max-width: 40%;
            height: auto;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .title {
            font-family: Georgia, serif;
            font-size: 42px;
            letter-spacing: 6px;
            margin: 10px 0 25px;
            color: #e8e8e8;
            text-shadow:
                2px 2px 0 #222,
                -1px -1px 0 #000,
                0 0 12px rgba(255, 255, 255, 0.15);
        }

        .video-container {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .coming-soon {
            font-family: Georgia, serif;
            font-size: 16px;
            letter-spacing: 2px;
            margin: 35px 20px 40px;
            color: #e8e8e8;
            text-shadow:
                2px 2px 0 #222,
                -1px -1px 0 #000,
                0 0 12px rgba(255, 255, 255, 0.15);
        }

        .patreon-section {
            width: 90%;
            max-width: 600px;
            margin: 0 auto 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px;
        }

        .patreon-preview {
            width: 22.5%;
            flex-shrink: 0;
            display: block;
        }

        .patreon-preview img {
            width: 100%;
            height: auto;
            display: block;
            border: none;
        }

        .documentary-title {
            font-family: Georgia, serif;
            color: #e8e8e8;
            text-shadow:
                2px 2px 0 #222,
                -1px -1px 0 #000,
                0 0 12px rgba(255, 255, 255, 0.15);
            line-height: 1.1;
            letter-spacing: 3px;
        }

        .behind {
            display: block;
            font-size: 24px;
            white-space: nowrap;
        }

        .documentary {
            display: block;
            font-size: 24px;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .title {
                font-size: 30px;
                letter-spacing: 4px;
            }

            .coming-soon {
                font-size: 16px;
                letter-spacing: 1px;
            }

            .patreon-section {
                gap: 15px;
            }

            .behind,
            .documentary {
                font-size: 16px;
                letter-spacing: 2px;
            }
        }
    </style>
</head>

<body>

    <img class="logo" src="zwflogo.webp" alt="ZeusWeusFilm logo">

    <h1 class="title">Knock Knock</h1>

    <div class="video-container">
        <iframe
            src="https://www.youtube.com/embed/WBCVE2-bUYA"
            title="Knock Knock"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>

    <h2 class="coming-soon">Physical DVD Coming Soon</h2>

    <div class="patreon-section">

        <a
            class="patreon-preview"
            href="https://www.patreon.com/zeusweusfilm/posts/knock-knock-149435570"
            target="_blank"
            rel="noopener noreferrer">

            <img
                src="behind-scenes.webp"
                alt="Behind The Scenes Documentary">

        </a>

        <div class="documentary-title">
            <span class="behind">Behind The Scenes</span>
            <span class="documentary">Documentary</span>
        </div>

    </div>

</body>
</html>
