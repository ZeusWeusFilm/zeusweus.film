<!DOCTYPE html>
<html>
<head>
    <title>ZeusWeusFilm</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background-color: #080a0b;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .logo {
            width: 120px;
            max-width: 40%;
            height: auto;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .title {
            font-family: Georgia, serif;
            font-size: 42px;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin: 10px 0 25px;
            color: #e8e8e8;
            text-shadow:
                2px 2px 0 #222,
                -1px -1px 0 #000,
                0 0 12px rgba(255, 255, 255, 0.15);
        }

        .video-container {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 600px) {
            .title {
                font-size: 30px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>

<body>

    <img class="logo" src="zwflogo.webp" alt="ZeusWeusFilm logo">

    <h1 class="title">Knock Knock</h1>

    <div class="video-container">
        <iframe
            src="https://www.youtube.com/embed/WBCVE2-bUYA"
            title="Knock Knock"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
