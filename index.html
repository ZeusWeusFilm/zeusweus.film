        }

        /* Background image */
        body::before {
            content: "";
            position: fixed;
            top: -20px;
            left: -20px;
            width: calc(100% + 40px);
            height: calc(100% + 40px);
            background-image: url("background.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(5px);
            opacity: 0.30;
            z-index: 0;
            pointer-events: none;
        }

        /* Dark overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 10, 11, 0.55);
            z-index: 1;
            pointer-events: none;
        }

        /* Keep content above background */
        body > * {
            position: relative;
