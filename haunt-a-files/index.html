<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ZeusWeusFilm - Haunt-A-Files</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #080a0b;
            color: #e8e8e8;
        }

        body {
            font-family: Georgia, serif;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.72),
                    rgba(0, 0, 0, 0.72)
                ),
                url("images/background.webp");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: blur(2px);
            opacity: 0.30;
            transform: scale(1.02);

            z-index: 0;
            pointer-events: none;
        }

        .page-content {
            position: relative;
            z-index: 1;

            width: 100%;
            min-height: 100vh;

            padding: 25px 20px 0;

            display: flex;
            flex-direction: column;

            text-align: center;
        }

        .logo {
            display: block;
            width: 120px;
            max-width: 45vw;
            height: auto;

            margin: 0 auto 35px;
        }

        h1 {
            margin: 0 0 30px;

            font-family: Georgia, serif;
            font-size: 38px;
            font-weight: normal;
            letter-spacing: 2px;

            color: #e8e8e8;
        }

        .description {
            width: 95%;
            max-width: 950px;

            margin: 0 auto 30px;

            font-family: Georgia, serif;
            font-size: 17px;
            line-height: 1.6;

            color: #cfcfcf;
        }

        .social-links {
            margin-top: auto;

            padding-top: 60px;
            padding-bottom: 35px;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 22px;
            flex-wrap: wrap;
        }

        .social-links a {
            color: #bdbdbd;

            text-decoration: none;

            font-family: Georgia, serif;
            font-size: 15px;

            letter-spacing: 1px;

            transition:
                color 0.25s ease,
                opacity 0.25s ease;
        }

        .social-links a:hover {
            color: #ffffff;
            opacity: 0.85;
        }

        @media (max-width: 600px) {

            .page-content {
                padding: 20px 15px 0;
            }

            .logo {
                width: 105px;
                margin-bottom: 30px;
            }

            h1 {
                font-size: 30px;
                letter-spacing: 1.5px;
                margin-bottom: 25px;
            }

            .description {
                width: 95%;
                font-size: 16px;
                line-height: 1.6;
            }

            .social-links {
                gap: 16px;
                padding-top: 50px;
                padding-bottom: 30px;
            }

            .social-links a {
                font-size: 14px;
            }

        }

    </style>
</head>

<body>

    <div class="background"></div>

    <div class="page-content">

        <img
            class="logo"
            src="../zwflogo.webp"
            alt="ZeusWeusFilm">

        <h1>
            Haunt-A-Files
        </h1>

        <div class="description">
            Join Big Zeus, Spontaneous Mike and Technical T in the
            terrifying paranormal investigation show
            "Haunt-A-Files" as they document the scariest phenomena
            unknown to man.
        </div>

        <div class="social-links">

    <a
        href="../comingsoon.html">
        Contact
    </a>

    <a
        href="../comingsoon.html">
        Physical
    </a>

    <a
        href="https://paypal.me/ASmyth115"
        target="_blank"
        rel="noopener noreferrer">
        PayPal
    </a>

</div>

    </div>

</body>
</html>
