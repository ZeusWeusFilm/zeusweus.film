<!DOCTYPE html>
<html>
<head>
    <title>ZeusWeusFilm - IDIR</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html {
            background-color: #080a0b;
        }

        body {
            background-color: #080a0b;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background image */
        body::before {
            content: "";
            position: fixed;
            top: -20px;
            left: -20px;
            width: calc(100% + 40px);
            height: calc(100% + 40px);
            background-image: url("background.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(5px);
            opacity: 0.30;
            z-index: 0;
            pointer-events: none;
        }

        /* Dark overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 10, 11, 0.55);
            z-index: 1;
            pointer-events: none;
        }

        /* Keep content above background */
        body > * {
            position: relative;
            z-index: 2;
        }

        /* Logo */
        .logo {
            display: block;
            width: 120px;
            max-width: 40%;
            height: auto;
            margin: 25px auto 0;
        }

        /* Master footer links */
        .social-links {
            position: absolute;
            bottom: 35px;
            left: 0;
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;

            text-align: center;
        }

        .social-links a {
            color: #e8e8e8;
            text-decoration: none;
            font-family: Georgia, serif;
            font-size: 15px;
            letter-spacing: 1px;
            transition: opacity 0.2s ease;
        }

        .social-links a:hover {
            opacity: 0.65;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .social-links {
                bottom: 35px;
                gap: 14px;
            }

            .social-links a {
                font-size: 13px;
                letter-spacing: 1px;
            }
        }
    </style>
</head>

<body>

    <!-- ZeusWeusFilm logo -->
    <a href="../index.html">
        <img
            class="logo"
            src="../zwflogo.webp"
            alt="ZeusWeusFilm logo">
    </a>

    <!-- Master footer links -->
    <div class="social-links">

        <a
            href="../contact">
            Contact
        </a>

        <a
            href="../physical/">
            Physical
        </a>

        <a
            href="https://paypal.me/ASmyth115"
            target="_blank"
            rel="noopener noreferrer">
            PayPal
        </a>

        <a
            href="../garfield.html">
            ???
        </a>

    </div>

</body>
</html>
