<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZeusWeusFilm - Final Say for Mr Everyday</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #050505;
            color: #e8e8e8;
        }

        /* BACKGROUND */

        .background {
            position: fixed;
            inset: -10px;
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.65),
                    rgba(0, 0, 0, 0.65)
                ),
                url("final-say-for-mr-everyday/images/background.webp") center center / cover no-repeat;
            filter: blur(2px);
            opacity: 0.30;
            z-index: 0;
        }

        /* PAGE CONTENT */

        .page-content {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 25px 20px 0;
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        /* ZEUSWEUSFILM LOGO */

        .logo-link {
            display: block;
            width: fit-content;
            margin: 0 auto 35px;
        }

        .logo {
            display: block;
            width: 120px;
            max-width: 40vw;
            height: auto;
            margin: 0;
        }

        /* FILM TITLE */

        h1 {
            margin: 0 0 30px;
            font-family: Georgia, serif;
            font-size: 36px;
            font-weight: normal;
            letter-spacing: 2px;
        }

        /* MAIN CONTENT */

        .main-content {
            flex: 1;
        }

        /* FOOTER */

        .social-links {
            margin: 60px auto 0;
            padding-bottom: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .social-links a {
            color: #e8e8e8;
            text-decoration: none;
            font-family: Georgia, serif;
            font-size: 15px;
            letter-spacing: 1px;
            transition: opacity 0.2s ease;
        }

        .social-links a:hover {
            opacity: 0.65;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .page-content {
                padding: 20px 12px 0;
            }

            .logo-link {
                margin-bottom: 28px;
            }

            .logo {
                width: 100px;
            }

            h1 {
                font-size: 28px;
                margin-bottom: 25px;
            }

            .social-links {
                padding-bottom: 35px;
                gap: 14px;
            }

            .social-links a {
                font-size: 13px;
                letter-spacing: 1px;
            }
        }

    </style>
</head>

<body>

    <!-- BACKGROUND -->

    <div class="background"></div>

    <div class="page-content">

        <!-- ZEUSWEUSFILM LOGO -->

        <a
            href="/"
            class="logo-link"
        >
            <img
                src="/zwflogo.webp"
                alt="ZeusWeusFilm"
                class="logo"
            >
        </a>

        <!-- FILM TITLE -->

        <h1>Final Say for Mr Everyday</h1>

        <!-- MAIN CONTENT -->

        <main class="main-content">

        </main>

        <!-- FOOTER LINKS -->

        <div class="social-links">

            <a href="/contact">
                Contact
            </a>

            <a href="/physical/">
                Physical
            </a>

            <a
                href="https://paypal.me/ASmyth115"
                target="_blank"
                rel="noopener noreferrer"
            >
                PayPal
            </a>

        </div>

    </div>

</body>
</html>
