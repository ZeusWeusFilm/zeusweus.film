<!DOCTYPE html>
<html>
<head>
    <title>ZeusWeusFilm - Coming Soon</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html {
            background-color: #080a0b;
        }

        body {
            background-color: #080a0b;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background image */
        body::before {
            content: "";
            position: fixed;
            top: -20px;
            left: -20px;
            width: calc(100% + 40px);
            height: calc(100% + 40px);
            background-image: url("background.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(5px);
            opacity: 0.30;
            z-index: 0;
            pointer-events: none;
        }

        /* Dark overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 10, 11, 0.55);
            z-index: 1;
            pointer-events: none;
        }

        /* Keep content above background */
        body > * {
            position: relative;
            z-index: 2;
        }

        /* Logo */
        .logo {
            display: block;
            width: 120px;
            max-width: 40%;
            height: auto;
            margin: 25px auto 0;
        }

        /* Coming Soon */
        .coming-soon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 90%;

            font-family: Georgia, serif;
            font-size: 48px;
            letter-spacing: 8px;
            color: #e8e8e8;

            text-shadow:
                2px 2px 0 #222,
                -1px -1px 0 #000,
                0 0 12px rgba(255, 255, 255, 0.15);

            animation: creepyFlicker 7s infinite;
        }

        /* Subtle eerie flicker */
        @keyframes creepyFlicker {

            0%, 88%, 100% {
                opacity: 1;
                transform: translate(-50%, -50%);
            }

            89% {
                opacity: 0.75;
                transform: translate(calc(-50% - 1px), -50%);
            }

            90% {
                opacity: 1;
                transform: translate(calc(-50% + 1px), -50%);
            }

            91% {
                opacity: 0.85;
                transform: translate(-50%, calc(-50% + 1px));
            }

            92% {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        /* Social links */
        .social-links {
            position: absolute;
            bottom: 35px;
            left: 0;
            width: 100%;

            text-align: center;
            font-family: Georgia, serif;
            font-size: 15px;
            letter-spacing: 2px;
        }

        .social-links a {
            color: #bdbdbd;
            text-decoration: none;
            margin: 0 12px;

            transition:
                color 0.3s ease,
                text-shadow 0.3s ease;
        }

        .social-links a:hover {
            color: #ffffff;
            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.45);
        }

        /* Mobile */
        @media (max-width: 600px) {

            .coming-soon {
                font-size: 30px;
                letter-spacing: 5px;
            }

            .social-links {
                font-size: 13px;
                letter-spacing: 1px;
            }

            .social-links a {
                margin: 0 6px;
            }
        }
    </style>
</head>

<body>

    <!-- ZeusWeusFilm logo -->
    <img
        class="logo"
        src="zwflogo.webp"
        alt="ZeusWeusFilm logo">

    <!-- Coming Soon -->
    <div class="coming-soon">
        COMING SOON
    </div>

    <!-- Social links -->
    <div class="social-links">

        <a
            href="https://www.patreon.com/c/zeusweusfilm"
            target="_blank"
            rel="noopener noreferrer">
            Patreon
        </a>

        <a
            href="https://www.youtube.com/@ZeusWeusFilm"
            target="_blank"
            rel="noopener noreferrer">
            YouTube
        </a>

        <a
            href="https://www.instagram.com/zeusweusfilm"
            target="_blank"
            rel="noopener noreferrer">
            Instagram
        </a>

        <a
            href="https://x.com/ZeusWeusFilm"
            target="_blank"
            rel="noopener noreferrer">
            X
        </a>

        <a
            href="https://paypal.me/ASmyth115"
            target="_blank"
            rel="noopener noreferrer">
            PayPal
        </a>

    </div>

</body>
</html>
